cargo-features = ["profile-rustflags"]

[package]
name = "flexmap"
version = "0.1.0"
edition = "2021"
channel = "nightly"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
colored = "2.1.0"
# Pinned to the SAME revs flexalign pins. Unpinned, cargo resolves this to a different kmerrs
# than the parent does, so the dependency graph carries two copies -- and flexmap gets compiled
# against whichever one lacks the symbols it needs (`mask_coremer`), which breaks any build that
# does not have a local `paths` override collapsing them. That override exists only on a
# developer machine, so the failure appears the moment anyone else builds.
kmerrs = { git = "https://github.com/4less/kmerr.git", rev = "3b86438d083ba83d334ba19a5f5a45ad045f247d" }
bioreader = { git = "https://github.com/4less/bioreader.git", rev = "1ba00bb9055ec71334c87576e12023f994dd1390" }
savefile = { version="0.17", feature="derive" }
savefile-derive = "0.17"
ser_raw = "0.1.0"
serde = { version = "1.0.207", features = ["derive"] }
serde_derive = "1.0.207"
bincode = { version = "2.0.0-rc.3" }
fxhash = "0.2.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
memmap2 = "0.9"

[profile.release]
opt-level = 3               # Use best optimizations
overflow-checks = false     # Disable integer overflow checks.
rustflags = ["-C", "target-feature=+avx,+sse3,+avx2,+fma"]#
